<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilinca | Acasă</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --glass: rgba(255, 255, 255, 0.7); 
            --border: rgba(255, 255, 255, 0.4); 
            --dark: #1d1d1f; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: linear-gradient(135deg, #cfd9df 0%, #e2ebf0 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        
        /* --- MENIU UNIFORMIZAT PENTRU TOATE PAGINILE --- */
.menu-toggle { 
    position: fixed; 
    bottom: 30px; 
    right: 30px; 
    width: 60px; 
    height: 60px; 
    background: white; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 1.2rem; 
    border: 1px solid rgba(0, 0, 0, 0.08); 
    box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
    z-index: 3000; 
    cursor: pointer; 
}

nav { 
    position: fixed; 
    bottom: 105px; 
    right: 30px; 
    background: rgba(255, 255, 255, 0.9); 
    backdrop-filter: blur(15px); 
    border-radius: 35px; 
    border: 1px solid rgba(0, 0, 0, 0.08); 
    display: flex; 
    flex-direction: column; 
    padding: 15px 0; 
    gap: 15px; 
    z-index: 2000; 
    
    /* ACESTEA SUNT CHEIA: */
    width: 60px;           /* Aceeași lățime peste tot */
    align-items: center;    /* Centrează perfect iconițele pe mijloc */

    transform: translateY(20px); 
    opacity: 0; 
    visibility: hidden; 
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
}

nav.active { 
    transform: translateY(0); 
    opacity: 1; 
    visibility: visible; 
}

.nav-item { 
    text-decoration: none; 
    color: #1d1d1f; 
    font-size: 1.4rem; 
    width: 40px; 
    height: 40px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
}

.nav-item i {
    width: 24px;       /* Forțează iconița într-un spațiu egal */
    text-align: center; /* Rezolvă problema iconiței de locație */
}


        .nav-item:hover { color: #555; transform: scale(1.1); }

        .hero { text-align: center; animation: fadeIn 1.2s ease; }
        .logo-main { font-size: 3rem; font-weight: 200; letter-spacing: 8px; text-transform: uppercase; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    
    <nav id="main-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i></a>
        <a href="description.html" class="nav-item"><i class="fas fa-info-circle"></i></a>
        <a href="destinations.html" class="nav-item"><i class="fas fa-mountain"></i></a>
        <a href="spaces.html" class="nav-item"><i class="fas fa-bed"></i></a>
        <a href="location.html" class="nav-item"><i class="fas fa-map-marker-alt"></i></a>
        <a href="contact.html" class="nav-item"><i class="fas fa-paper-plane"></i></a>
    </nav>

    <div class="hero"><h1 class="logo-main">Ilinca</h1></div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('main-nav');
            const icon = document.querySelector('.menu-toggle i');
            nav.classList.toggle('active');
            if (nav.classList.contains('active')) {
                icon.className = 'fas fa-times';
            } else {
                icon.className = 'fas fa-bars';
            }
        }
    </script>
</body>
</html>

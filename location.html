<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locație | Casa Ilinca</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1d1d1f;
            --accent: #d4af37;
            --bg: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.8);
            --border: rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg); 
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { width: 100%; max-width: 500px; margin: 0 auto; }

        h1 { font-weight: 600; font-size: 2.2rem; margin: 20px 0 10px 0; color: var(--primary); }
        .subtitle { color: #86868b; margin-bottom: 30px; font-size: 0.9rem; }

        /* Harta Integrată Corectă (Izvoru Muntelui) */
        .map-container {
            width: 100%;
            height: 250px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 35px;
            border: 1px solid var(--border);
        }

        /* Split Cards */
        .split-card {
            display: flex;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            text-decoration: none;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            height: 140px;
            border: 1px solid var(--border);
        }

        .split-card.reverse { flex-direction: row-reverse; }

        .card-media { width: 35%; overflow: hidden; }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }

        .card-content {
            width: 65%;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .category {
            font-size: 8px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .card-content h2 { font-size: 1.1rem; color: var(--primary); margin-bottom: 4px; }
        .card-content p { font-size: 0.75rem; color: #86868b; line-height: 1.3; }

        /* Buton Navigare Rapidă */
        .nav-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: white;
            padding: 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
            margin-bottom: 40px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Meniu Hamburger */
        /* --- MENIU UNIFORMIZAT PENTRU TOATE PAGINILE --- */
.menu-toggle { 
    position: fixed; 
    bottom: 30px; 
    right: 30px; 
    width: 60px; 
    height: 60px; 
    background: white; 
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 1.2rem; 
    border: 1px solid rgba(0, 0, 0, 0.08); 
    box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
    z-index: 3000; 
    cursor: pointer; 
}

nav { 
    position: fixed; 
    bottom: 105px; 
    right: 30px; 
    background: rgba(255, 255, 255, 0.9); 
    backdrop-filter: blur(15px); 
    border-radius: 35px; 
    border: 1px solid rgba(0, 0, 0, 0.08); 
    display: flex; 
    flex-direction: column; 
    padding: 15px 0; 
    gap: 15px; 
    z-index: 2000; 
    
    /* ACESTEA SUNT CHEIA: */
    width: 60px;           /* Aceeași lățime peste tot */
    align-items: center;    /* Centrează perfect iconițele pe mijloc */

    transform: translateY(20px); 
    opacity: 0; 
    visibility: hidden; 
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
}

nav.active { 
    transform: translateY(0); 
    opacity: 1; 
    visibility: visible; 
}

.nav-item { 
    text-decoration: none; 
    color: #1d1d1f; 
    font-size: 1.4rem; 
    width: 40px; 
    height: 40px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
}

.nav-item i {
    width: 24px;       /* Forțează iconița într-un spațiu egal */
    text-align: center; /* Rezolvă problema iconiței de locație */
}

         </style>
</head>
<body>

    <div class="container">
        <h1>Locație</h1>
        <p class="subtitle">Izvoru Muntelui, Neamț - La poalele Ceahlăului</p>

        <div class="map-container">
            <iframe 
                src="https://maps.app.goo.gl/CcQ8inawKHwyP96M6?g_st=ipc" 
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
            </iframe>
        </div>

        <a href="https://maps.google.com/?q=46.943396,26.064986" class="nav-button">
            <i class="fas fa-location-arrow"></i> Pornește Navigația
        </a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars" id="menu-icon"></i></div>
    <nav id="main-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i></a>
        <a href="description.html" class="nav-item"><i class="fas fa-info-circle"></i></a>
        <a href="destinations.html" class="nav-item"><i class="fas fa-mountain"></i></a>
        <a href="spaces.html" class="nav-item"><i class="fas fa-bed"></i></a>
        <a href="location.html" class="nav-item"><i class="fas fa-map-marker-alt"></i></a>
        <a href="contact.html" class="nav-item"><i class="fas fa-paper-plane"></i></a>
    </nav>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('main-nav');
            const icon = document.getElementById('menu-icon');
            nav.classList.toggle('active');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-times');
        }
    </script>
</body>
</html>

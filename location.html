<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Locație | Casa Ilinca</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1d1d1f;
            --accent: #8e8e93;
            --bg: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.85);
            --border: rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100%; 
            background-color: var(--bg);
            overflow-x: hidden;
            overscroll-behavior-y: auto;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            padding: 20px;
        }

        /* Animație curată (doar opacity) pentru a evita zoom-ul automat */
        .container { 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto; 
            animation: fadeInSimple 0.8s ease-out forwards;
            padding-bottom: 120px;
        }

        @keyframes fadeInSimple {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1 { font-weight: 600; font-size: 2.5rem; margin: 20px 0 5px 0; color: var(--primary); letter-spacing: -1px; }
        .subtitle { color: var(--accent); margin-bottom: 30px; font-size: 1rem; font-weight: 300; }

        /* Harta Integrată (Locația Izvoru Muntelui) */
        .map-container {
            width: 100%;
            height: 350px;
            border-radius: 35px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid var(--border);
            background: #eee;
        }

        /* Buton Navigare Rapidă - Stil Fix/Premium */
        .nav-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
        }

        .nav-button:active { transform: scale(0.96); }

        /* --- MENIU UNIFORMIZAT --- */
        .menu-toggle { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            width: 60px; 
            height: 60px; 
            background: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.2rem; 
            border: 1px solid var(--border); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            z-index: 3000; 
            cursor: pointer; 
        }

        nav { 
            position: fixed; 
            bottom: 105px; 
            right: 30px; 
            background: var(--glass); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px; 
            border: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            padding: 15px 0; 
            gap: 15px; 
            z-index: 2000; 
            width: 60px;           
            align-items: center;    
            transform: translateY(20px); 
            opacity: 0; 
            visibility: hidden; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        nav.active { 
            transform: translateY(0); 
            opacity: 1; 
            visibility: visible; 
        }

        .nav-item { 
            text-decoration: none; 
            color: var(--primary); 
            font-size: 1.4rem; 
            width: 40px; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .nav-item i { width: 24px; text-align: center; }

    </style>
</head>
<body>

    <div class="container">
        <h1>Locație</h1>
        <p class="subtitle">Izvoru Muntelui, Neamț<br>La poalele masivului Ceahlău</p>

        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10848.472851996765!2d25.9547037!3d46.9602513!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x473550993510e96f%3A0xc638a531e0503623!2sIzvoru%20Muntelui%20617307!5e0!3m2!1sro!2sro!4v1704510000000!5m2!1sro!2sro" 
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
            </iframe>
        </div>

        <a href="https://www.google.com/maps/dir/?api=1&destination=Izvoru+Muntelui+Neamt" target="_blank" class="nav-button">
            <i class="fas fa-location-arrow"></i> Pornește Navigația
        </a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    
    <nav id="main-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i></a>
        <a href="description.html" class="nav-item"><i class="fas fa-info-circle"></i></a>
        <a href="destinations.html" class="nav-item"><i class="fas fa-mountain"></i></a>
        <a href="spaces.html" class="nav-item"><i class="fas fa-bed"></i></a>
        <a href="location.html" class="nav-item"><i class="fas fa-map-marker-alt"></i></a>
        <a href="contact.html" class="nav-item"><i class="fas fa-paper-plane"></i></a>
    </nav>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('main-nav');
            const icon = document.querySelector('.menu-toggle i');
            nav.classList.toggle('active');
            if (nav.classList.contains('active')) {
                icon.className = 'fas fa-times';
            } else {
                icon.className = 'fas fa-bars';
            }
        }
    </script>
</body>
</html>

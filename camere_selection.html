<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecție Camere | Casa Ilinca</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --glass: rgba(255, 255, 255, 0.7); 
            --border: rgba(255, 255, 255, 0.4); 
            --dark: #1d1d1f; 
            --nav-glass: rgba(255, 255, 255, 0.9);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: linear-gradient(135deg, #cfd9df 0%, #e2ebf0 100%); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* CONTAINER RESPONSIV */
        .container { 
            width: 100%; 
            max-width: 1200px; /* Extins pentru laptop */
            animation: fadeInPage 0.8s ease-out forwards;
            padding-bottom: 100px;
        }

        @keyframes fadeInPage { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .back-btn { 
            text-decoration: none; 
            color: var(--dark); 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 20px; 
            font-size: 0.9rem; 
            transition: opacity 0.2s;
        }
        .back-btn:hover { opacity: 0.7; }

        h1 { font-weight: 300; margin-bottom: 25px; color: var(--dark); }

        /* GRID PENTRU CAMERE */
        .rooms-grid {
            display: grid;
            grid-template-columns: 1fr; /* Mobil: o coloană */
            gap: 20px;
        }
        
        .chapter-card { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            border-radius: 25px; 
            overflow: hidden; 
            border: 1px solid var(--border); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); 
            transition: all 0.3s ease; 
        }

        .chapter-card:hover { 
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .chapter-card:active { transform: scale(0.97); }

        .chapter-image { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.6s ease;
        }

        .chapter-card:hover .chapter-image {
            transform: scale(1.08);
        }

        .chapter-overlay { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: linear-gradient(transparent, rgba(0,0,0,0.8)); 
            padding: 20px; 
            color: white; 
        }
        .chapter-overlay h2 { font-size: 1.2rem; font-weight: 600; }

        /* --- MENIU HAMBURGER --- */
        .menu-toggle { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            width: 60px; 
            height: 60px; 
            background: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.2rem; 
            border: 1px solid rgba(0, 0, 0, 0.08); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            z-index: 3000; 
            cursor: pointer; 
        }

        nav { 
            position: fixed; 
            bottom: 105px; 
            right: 30px; 
            background: var(--nav-glass); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px; 
            border: 1px solid rgba(0, 0, 0, 0.08); 
            display: flex; 
            flex-direction: column; 
            padding: 15px 0; 
            gap: 15px; 
            z-index: 2000; 
            width: 60px;
            align-items: center; 
            transform: translateY(20px); 
            opacity: 0; 
            visibility: hidden; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        nav.active { transform: translateY(0); opacity: 1; visibility: visible; }
        .nav-item { text-decoration: none; color: #1d1d1f; font-size: 1.4rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }

        /* --- MEDIA QUERY PENTRU LAPTOP/DESKTOP --- */
        @media (min-width: 768px) {
            body { padding: 40px; }
            h1 { font-size: 2.5rem; margin-bottom: 40px; text-align: left; }

            .rooms-grid {
                grid-template-columns: 1fr 1fr; /* Două camere pe rând */
                gap: 30px;
            }

            .chapter-card {
                aspect-ratio: 16 / 10; /* Puțin mai înalte pe desktop */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="interior_selection.html" class="back-btn"><i class="fas fa-arrow-left"></i> Înapoi la Interior</a>
        <h1>Alege Camera</h1>

        <div class="rooms-grid">
            <a href="camera1.html" style="text-decoration: none;">
                <div class="chapter-card">
                    <img src="cam1_1.jpg" class="chapter-image">
                    <div class="chapter-overlay"><h2>Camera 1</h2></div>
                </div>
            </a>

            <a href="camera2.html" style="text-decoration: none;">
                <div class="chapter-card">
                    <img src="cam2_1.jpg" class="chapter-image">
                    <div class="chapter-overlay"><h2>Camera 2</h2></div>
                </div>
            </a>

            <a href="camera3.html" style="text-decoration: none;">
                <div class="chapter-card">
                    <img src="cam3_1.jpg" class="chapter-image">
                    <div class="chapter-overlay"><h2>Camera 3</h2></div>
                </div>
            </a>

            <a href="camera4.html" style="text-decoration: none;">
                <div class="chapter-card">
                    <img src="cam4_1.jpg" class="chapter-image">
                    <div class="chapter-overlay"><h2>Camera 4</h2></div>
                </div>
            </a>
        </div>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    
    <nav id="main-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i></a>
        <a href="description.html" class="nav-item"><i class="fas fa-info-circle"></i></a>
        <a href="destinations.html" class="nav-item"><i class="fas fa-mountain"></i></a>
        <a href="spaces.html" class="nav-item"><i class="fas fa-bed"></i></a>
        <a href="location.html" class="nav-item"><i class="fas fa-map-marker-alt"></i></a>
        <a href="contact.html" class="nav-item"><i class="fas fa-paper-plane"></i></a>
    </nav>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('main-nav');
            const icon = document.querySelector('.menu-toggle i');
            nav.classList.toggle('active');
            if (nav.classList.contains('active')) {
                icon.className = 'fas fa-times';
            } else {
                icon.className = 'fas fa-bars';
            }
        }
    </script>
</body>
</html>

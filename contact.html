<!DOCTYPE html>
<html lang="ro">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-363415031"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-363415031');
    </script>

    <script>
    function gtag_report_conversion(url) {
      var callback = function () {
        if (typeof(url) != 'undefined') {
          window.location = url;
        }
      };
      gtag('event', 'conversion', {
          'send_to': 'AW-363415031/j6p6CP_Y_6AZEPe_z60B',
          'event_callback': callback
      });
      return false;
    }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact | Casa Ilinca</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1d1d1f;
            --accent: #8e8e93;
            --bg: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.85);
            --border: rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100%; 
            background-color: var(--bg);
            overflow-x: hidden;
            overscroll-behavior-y: auto;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            padding: 20px;
        }

        .container { 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto; 
            animation: fadeInSimple 0.8s ease-out forwards;
            padding-bottom: 120px;
        }

        @keyframes fadeInSimple {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1 { font-weight: 600; font-size: 2.5rem; margin: 20px 0 5px 0; color: var(--primary); letter-spacing: -1px; }
        .subtitle { color: var(--accent); margin-bottom: 35px; font-size: 1rem; font-weight: 300; }

        .split-card {
            display: flex;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            text-decoration: none;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            height: 140px;
            border: 1px solid var(--border);
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .split-card.reverse { flex-direction: row-reverse; }
        .split-card:active { transform: scale(0.97); }

        .card-media {
            width: 35%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f2;
        }

        .card-media img { width: 100%; height: 100%; object-fit: cover; }
        .card-media i { font-size: 2.5rem; color: white; }

        .card-content {
            width: 65%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .category {
            font-size: 9px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .card-content h2 { font-size: 1.2rem; color: var(--primary); margin-bottom: 5px; font-weight: 600; }
        .card-content p { font-size: 0.85rem; color: #86868b; line-height: 1.3; font-weight: 400; }

        .menu-toggle { 
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; 
            background: white; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; font-size: 1.2rem; border: 1px solid var(--border); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 3000; cursor: pointer; 
        }

        nav { 
            position: fixed; bottom: 105px; right: 30px; background: var(--glass); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 35px; border: 1px solid var(--border); 
            display: flex; flex-direction: column; padding: 15px 0; gap: 15px; 
            z-index: 2000; width: 60px; align-items: center;    
            transform: translateY(20px); opacity: 0; visibility: hidden; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        nav.active { transform: translateY(0); opacity: 1; visibility: visible; }
        .nav-item { text-decoration: none; color: var(--primary); font-size: 1.4rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .nav-item i { width: 24px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Contact</h1>
        <p class="subtitle">Suntem la un click distanță pentru orice întrebare.</p>

        <a onclick="return gtag_report_conversion('tel:0735722314')" class="split-card">
            <div class="card-media">
                <img src="call.JPG" alt="Rezervări">
            </div>
            <div class="card-content">
                <span class="category">Rezervări</span>
                <h2>Sună-ne</h2>
                <p>Contactează-ne telefonic pentru disponibilitate.</p>
            </div>
        </a>

        <a onclick="return gtag_report_conversion('https://wa.me/40735722314')" class="split-card reverse">
            <div class="card-media" style="background: #25D366;">
                <i class="fab fa-whatsapp"></i>
            </div>
            <div class="card-content">
                <span class="category">Mesaj Rapid</span>
                <h2>WhatsApp</h2>
                <p>Scrie-ne și îți răspundem rapid pe chat.</p>
            </div>
        </a>

        <a href="location.html" class="split-card">
            <div class="card-media">
                <img src="pin.JPG" alt="Locație">
            </div>
            <div class="card-content">
                <span class="category">Navigație</span>
                <h2>Găsește-ne</h2>
                <p>Str. Izvorul Muntelui, Nr. 48A, Neamț.</p>
            </div>
        </a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    
    <nav id="main-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i></a>
        <a href="description.html" class="nav-item"><i class="fas fa-info-circle"></i></a>
        <a href="destinations.html" class="nav-item"><i class="fas fa-mountain"></i></a>
        <a href="spaces.html" class="nav-item"><i class="fas fa-bed"></i></a>
        <a href="location.html" class="nav-item"><i class="fas fa-map-marker-alt"></i></a>
        <a href="contact.html" class="nav-item"><i class="fas fa-paper-plane"></i></a>
    </nav>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('main-nav');
            const icon = document.querySelector('.menu-toggle i');
            nav.classList.toggle('active');
            if (nav.classList.contains('active')) {
                icon.className = 'fas fa-times';
            } else {
                icon.className = 'fas fa-bars';
            }
        }
    </script>
</body>
</html>

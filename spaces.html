<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spații | Casa Ilinca</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #1d1d1f;
            --accent: #8e8e93; /* Unificat cu restul paginilor */
            --bg: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.9);
            --border: rgba(0, 0, 0, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100%; 
            background-color: var(--bg);
            overflow-x: hidden;
            overscroll-behavior-y: auto;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            padding: 20px;
        }

        /* Container cu animație simplă de opacitate (previne zoom-ul) */
        .container { 
            width: 100%; 
            max-width: 500px; 
            margin: 0 auto; 
            animation: fadeInSimple 0.8s ease-out forwards;
            padding-bottom: 120px;
        }

        @keyframes fadeInSimple {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1 { 
            font-weight: 600; 
            font-size: 2.5rem; 
            margin: 20px 0 30px 0; 
            color: var(--primary); 
            letter-spacing: -1px;
        }

        /* --- SPLIT CARDURI MARI --- */
        .split-card {
            display: flex;
            background: white;
            border-radius: 35px; /* Rotunjire mai mare, stil Apple */
            overflow: hidden;
            text-decoration: none;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
            height: 220px; /* Am mărit înălțimea de la 160px la 220px */
            border: 1px solid var(--border);
        }

        .split-card.reverse { flex-direction: row-reverse; }
        .split-card:active { transform: scale(0.97); }

        .card-media { 
            width: 45%; /* Am mărit puțin zona de imagine */
            overflow: hidden; 
        }
        .card-media img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .card-content {
            width: 55%;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .category {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-content h2 { 
            font-size: 1.5rem; /* Titlu mai mare */
            color: var(--primary); 
            margin-bottom: 8px; 
            font-weight: 600;
        }

        .card-content p { 
            font-size: 0.9rem; 
            color: var(--accent); 
            line-height: 1.4; 
        }

        .card-arrow { 
            position: absolute; 
            bottom: 20px; 
            right: 25px; 
            color: var(--primary); 
            font-size: 0.9rem; 
            opacity: 0.3;
        }

        /* --- MENIU UNIFORMIZAT --- */
        .menu-toggle { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            width: 60px; 
            height: 60px; 
            background: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.2rem; 
            border: 1px solid var(--border); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            z-index: 3000; 
            cursor: pointer; 
        }

        nav { 
            position: fixed; 
            bottom: 105px; 
            right: 30px; 
            background: var(--glass); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px; 
            border: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            padding: 15px 0; 
            gap: 15px; 
            z-index: 2000; 
            width: 60px;
            align-items: center; 
            transform: translateY(20px); 
            opacity: 0; 
            visibility: hidden; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        nav.active { transform: translateY(0); opacity: 1; visibility: visible; }
        .nav-item { text-decoration: none; color: var(--primary); font-size: 1.4rem; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
        .nav-item i { width: 24px; text-align: center; }

    </style>
</head>
<body>

    <div class="container">
        <h1>Spații</h1>

        <a href="exterior.html" class="split-card">
            <div class="card-media"><img src="c_ext.jpg" alt="Exterior"></div>
            <div class="card-content">
                <span class="category">Outdoor</span>
                <h2>Exterior</h2>
                <p>Curtea, foișorul și zonele de relaxare.</p>
                <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
            </div>
        </a>

        <a href="interior_selection.html" class="split-card reverse">
            <div class="card-media"><img src="c_int.jpg" alt="Interior"></div>
            <div class="card-content">
                <span class="category">Indoor</span>
                <h2>Interior</h2>
                <p>Dormitoare, living și design rafinat.</p>
                <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
            </div>
        </a>
    </div>

    <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    
    <nav id="main-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i></a>
        <a href="description.html" class="nav-item"><i class="fas fa-info-circle"></i></a>
        <a href="destinations.html" class="nav-item"><i class="fas fa-mountain"></i></a>
        <a href="spaces.html" class="nav-item"><i class="fas fa-bed"></i></a>
        <a href="location.html" class="nav-item"><i class="fas fa-map-marker-alt"></i></a>
        <a href="contact.html" class="nav-item"><i class="fas fa-paper-plane"></i></a>
    </nav>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('main-nav');
            const icon = document.querySelector('.menu-toggle i');
            nav.classList.toggle('active');
            if (nav.classList.contains('active')) {
                icon.className = 'fas fa-times';
            } else {
                icon.className = 'fas fa-bars';
            }
        }
    </script>
</body>
</html>
